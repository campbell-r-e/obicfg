[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obicfg"
version = "0.1.0"
description = "Command-line configurator for OBi200-family VoIP ATAs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Campbell Reed" }]
keywords = ["obi200", "obihai", "polycom", "ata", "voip", "sip", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Telephony",
    "Topic :: System :: Networking",
]
# No runtime dependencies, deliberately: this needs to run on whatever
# Python is already installed on the box next to the ATA.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only needed to read TOML profiles on Python older than 3.11.
toml = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
obicfg = "obicfg.cli:main"

[project.urls]
Homepage = "https://github.com/campbell-r-e/obicfg"
Issues = "https://github.com/campbell-r-e/obicfg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
